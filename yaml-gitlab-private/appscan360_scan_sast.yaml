# ============================================================================================
# OPTION A - central repo is a PRIVATE project in the SAME GitLab instance as the scanned projects.
# Group-level CI/CD variables:
#   APPSCAN_TEMPLATES_PROJECT = security/appscan360-gitlab
#   APPSCAN_TEMPLATES_REF     = v1
#   APPSCAN_SCRIPTS_GIT_URL   = https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.example.com/security/appscan360-gitlab.git
#   APPSCAN_SCRIPTS_GIT_REF   = v1
# Central project: Settings > CI/CD > Job token permissions -> allow the consuming group.
# ============================================================================================
# SAST scan. Include this one line in a project's .gitlab-ci.yml (nothing else needed):
#   include:
#     - project: '$APPSCAN_TEMPLATES_PROJECT'
#       ref: '$APPSCAN_TEMPLATES_REF'
#       file: 'yaml-gitlab-private/appscan360_scan_sast.yaml'
# Override any value below with a CI/CD variable of the same name (group or project level).
include:
  - project: '$APPSCAN_TEMPLATES_PROJECT'   # group/instance CI/CD variables, e.g. security/appscan360-gitlab
    ref: '$APPSCAN_TEMPLATES_REF'           # e.g. v1
    file: 'yaml-gitlab-private/appscan360_base.yaml'

stages:
  - scan-sast

appscan360-sast:
  extends: .appscan360_base
  stage: scan-sast
  variables:
    SAST_UPLOAD_MODE: "zip"              # zip (upload source, 360° prepares) | irx (SAClientUtil on runner) | auto
    SAST_ZIP_EXCLUDE: ""                 # glob list left out of the archive, e.g. "docs/*,*.log,vendor/*"
    SAST_CONFIG_FILE: ""                 # appscan-config.xml (irx: passed with -c; zip: put it at repo root)
    SAST_SOURCE_CODE_ONLY: "no"          # yes = -sco (skip binaries / Java bytecode)
    SAST_LATEST_COMMIT_ONLY: "no"        # yes = only files changed in last commit (irx mode)
    SAST_INCLUDE_SCA: "no"               # yes = SCA findings in the same IRX (irx mode)
    SAST_SECRETS: ""                     # enable | disable | only (irx mode)
    SAST_SCAN_SPEED: ""                  # simple | balanced | deep | thorough (irx mode)
    SAST_THIRD_PARTY: "no"               # yes = -t include third-party code (irx mode)
    SAST_JDK_PATH: ""                    # irx mode, Java projects
    APPSCAN_GATES: "severity"
    # ---- .NET: no build needed on 360° 2.2 (C#/VB source is compiled server-side). For SCA accuracy
    #      restore packages first so obj/project.assets.json exists (see commented before_script below).
    # ---- commonly overridden settings (defaults live in appscan360_base.yaml) -------------------
    # APPSCAN_APP_ID: ""                   # existing application id (never created); else APPSCAN_APP_NAME + APPSCAN_ASSET
    # APPSCAN_APP_NAME: $CI_PROJECT_NAME   # application name for lookup / auto-create
    # APPSCAN_ASSET: ""                    # asset group id or name for auto-create; empty = default group
    # APPSCAN_RUNNER_TAG: ""               # tag of the runner that can reach AppScan 360°
    # APPSCAN_SCAN_NAME: $CI_PROJECT_NAME-$CI_JOB_ID
    # APPSCAN_RESCAN_ID: ""                # re-execute an existing scan instead of creating a new one
    # APPSCAN_PERSONAL_SCAN: "no"
    # APPSCAN_TIMEOUT_MINUTES: "360"
    # APPSCAN_REPORT_FORMATS: "html,xml,gitlab"   # html,pdf,xml,csv,sarif,json,gitlab (+license,sbom for SCA)
    # APPSCAN_REPORT_DIR: "as360_output"   # artifact folder inside the project (excluded from scans)
    # ---- gates: fail the job on findings ----------------------------------------------------
    # APPSCAN_GATES: "threshold"           # severity | threshold | branch | compliance | license (comma list)
    # APPSCAN_FAILURE_THRESHOLD: "High"    # threshold gate: fail on any High or Critical
    # APPSCAN_SEV_SEC_GW: "criticalIssues" # severity gate: criticalIssues|highIssues|mediumIssues|lowIssues|totalIssues ...
    # APPSCAN_MAX_ISSUES_ALLOWED: "0"      # ... allowed count of that severity
    # APPSCAN_GATE_ALLOW_FAILURE: "no"     # yes = report only, never fail the job
  # ---- optional: restore packages before the scan so SCA sees transitive dependencies
  # before_script:
  #   - !reference [.appscan360_base, before_script]        # keep the template's setup
  #   - dotnet restore "$SOLUTION_FILE_PATH"                 # or: mvn dependency:resolve / npm ci
  artifacts:
    reports:
      sast: as360_output/gl-sast-report.json
  script:
    - $AS360 app
    - $AS360 sast
    - $AS360 report
    - $AS360 gate $APPSCAN_GATES
