# ============================================================================================
# OPTION A - central repo is a PRIVATE project in the SAME GitLab instance as the scanned projects.
# Group-level CI/CD variables:
#   APPSCAN_TEMPLATES_PROJECT = security/appscan360-gitlab
#   APPSCAN_TEMPLATES_REF     = v1
#   APPSCAN_SCRIPTS_GIT_URL   = https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.example.com/security/appscan360-gitlab.git
#   APPSCAN_SCRIPTS_GIT_REF   = v1
# Central project: Settings > CI/CD > Job token permissions -> allow the consuming group.
# ============================================================================================
# DAST API scan - Postman collection, OpenAPI definition, or recorded API traffic. Include this one line in a project's .gitlab-ci.yml (nothing else needed):
#   include:
#     - project: '$APPSCAN_TEMPLATES_PROJECT'
#       ref: '$APPSCAN_TEMPLATES_REF'
#       file: 'yaml-gitlab-private/appscan360_scan_dast_api_windows.yaml'
# WINDOWS runner variant (PowerShell). Override any value below with a CI/CD variable of the same name (group or project level).
include:
  - project: '$APPSCAN_TEMPLATES_PROJECT'   # group/instance CI/CD variables, e.g. security/appscan360-gitlab
    ref: '$APPSCAN_TEMPLATES_REF'           # e.g. v1
    file: 'yaml-gitlab-private/appscan360_base_windows.yaml'

stages:
  - scan-dast

appscan360-dast-api:
  extends: .appscan360_base
  stage: scan-dast
  needs: []
  variables:
    DAST_MODE: "api"
    DAST_API_METHOD: "openapi"          # postman | openapi | traffic
    DAST_API_BASE_URL: "https://api.example.com"
    DAST_API_DOMAINS: "api.example.com"
    DAST_OPENAPI_FILE: "openapi.yaml"   # or DAST_OPENAPI_URL
    DAST_OPENAPI_URL: ""
    DAST_API_KEYS: "$DAST_API_KEYS"     # "X-Api-Key=abc,Other=xyz" masked variable
    DAST_POSTMAN_COLLECTION: ""         # collection.json
    DAST_POSTMAN_ENV: ""
    DAST_POSTMAN_GLOBALS: ""
    DAST_POSTMAN_LINKED_FILES: ""       # zip
    DAST_EXPLORE_FILES: ""              # recorded API traffic (.dast.config) for method=traffic
    DAST_LOGIN_METHOD: "none"
    DAST_LOGIN_FILE: ""
    DAST_PRESENCE_ID: ""
    DAST_TEST_POLICY_ID: ""
    DAST_OPTIMIZATION: "Fast"
    APPSCAN_GATES: "severity"
    DAST_LOGIN_FILE: ""
    DAST_EXCLUDE_PATHS: ""
    DAST_ADDITIONAL_DOMAINS: ""
    DAST_THREADS: "10"
    DAST_SCAN_PRIORITY: "Regular"
    DAST_EPHEMERAL_PRESENCE: "no"
    DAST_PAYLOAD_JSON: ""
  artifacts:
    reports:
      dast: gl-dast-report.json
  script:
    - Invoke-Expression "$env:AS360 app"
    - Invoke-Expression "$env:AS360 dast"
    - Invoke-Expression "$env:AS360 report"
    - Invoke-Expression "$env:AS360 gate $env:APPSCAN_GATES"
