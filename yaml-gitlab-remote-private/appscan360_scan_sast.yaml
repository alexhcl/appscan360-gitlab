# ============================================================================================
# OPTION B - central repo is a PRIVATE project on a DIFFERENT (remote) GitLab instance.
# Central project: Settings > Access tokens -> role Reporter, scopes read_api + read_repository.
# Group-level CI/CD variables (mask the token):
#   APPSCAN_TEMPLATES_URL   = https://gitlab.remote.com/security/appscan360-gitlab/-/raw/v1
#   APPSCAN_TEMPLATES_TOKEN = glpat-xxxxxxxx
#   APPSCAN_SCRIPTS_GIT_URL = https://oauth2:glpat-xxxxxxxx@gitlab.remote.com/security/appscan360-gitlab.git
#   APPSCAN_SCRIPTS_GIT_REF = v1
# Project .gitlab-ci.yml:
#   include:
#     - remote: '$APPSCAN_TEMPLATES_URL/yaml-gitlab-remote-private/appscan360_scan_sast.yaml?private_token=$APPSCAN_TEMPLATES_TOKEN'
# ============================================================================================
# SAST scan. Include this one line in a project's .gitlab-ci.yml (nothing else needed):
#   include:
#     - remote: '$APPSCAN_TEMPLATES_URL/yaml-gitlab-remote-private/appscan360_scan_sast.yaml?private_token=$APPSCAN_TEMPLATES_TOKEN'
# Override any value below with a CI/CD variable of the same name (group or project level).
include:
  - remote: '$APPSCAN_TEMPLATES_URL/yaml-gitlab-remote-private/appscan360_base.yaml?private_token=$APPSCAN_TEMPLATES_TOKEN'   # <<< B token added

stages:
  - scan-sast

appscan360-sast:
  extends: .appscan360_base
  stage: scan-sast
  variables:
    SAST_UPLOAD_MODE: "zip"              # zip (upload source, 360° prepares) | irx (SAClientUtil on runner) | auto
    SAST_ZIP_EXCLUDE: ""                 # glob list left out of the archive, e.g. "docs/*,*.log,vendor/*"
    SAST_CONFIG_FILE: ""                 # appscan-config.xml (irx: passed with -c; zip: put it at repo root)
    SAST_SOURCE_CODE_ONLY: "no"          # yes = -sco (skip binaries / Java bytecode)
    SAST_LATEST_COMMIT_ONLY: "no"        # yes = only files changed in last commit (irx mode)
    SAST_INCLUDE_SCA: "no"               # yes = SCA findings in the same IRX (irx mode)
    SAST_SECRETS: ""                     # enable | disable | only (irx mode)
    SAST_SCAN_SPEED: ""                  # simple | balanced | deep | thorough (irx mode)
    SAST_THIRD_PARTY: "no"               # yes = -t include third-party code (irx mode)
    SAST_JDK_PATH: ""                    # irx mode, Java projects
    APPSCAN_GATES: "severity"
  artifacts:
    reports:
      sast: gl-sast-report.json
  script:
    - $AS360 app
    - $AS360 sast
    - $AS360 report
    - $AS360 gate $APPSCAN_GATES
