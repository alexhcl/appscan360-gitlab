# ============================================================================================
# OPTION B - central repo is a PRIVATE project on a DIFFERENT (remote) GitLab instance.
# Central project: Settings > Access tokens -> role Reporter, scopes read_api + read_repository.
# Group-level CI/CD variables (mask the token):
#   APPSCAN_TEMPLATES_URL   = https://gitlab.remote.com/security/appscan360-gitlab/-/raw/v1
#   APPSCAN_TEMPLATES_TOKEN = glpat-xxxxxxxx
#   APPSCAN_SCRIPTS_GIT_URL = https://oauth2:glpat-xxxxxxxx@gitlab.remote.com/security/appscan360-gitlab.git
#   APPSCAN_SCRIPTS_GIT_REF = v1
# Project .gitlab-ci.yml:
#   include:
#     - remote: '$APPSCAN_TEMPLATES_URL/yaml-gitlab-remote-private/appscan360_scan_sast.yaml?private_token=$APPSCAN_TEMPLATES_TOKEN'
# ============================================================================================
# HCL AppScan 360° - shared base for all scan templates - WINDOWS runner (PowerShell) (REMOTE PRIVATE GITLAB variant).
#
# ALL configuration lives here and in the scan templates. A project never needs to copy anything:
#   .gitlab-ci.yml of a project:
#     include:
#       - remote: '$APPSCAN_TEMPLATES_URL/yaml/appscan360_scan_sast.yaml'
#   or attach these templates via a compliance framework so no project file is touched at all.
#
# WHERE THE CENTRAL REPO LIVES is defined ONCE as group (or instance) CI/CD variables, never in files:
#   APPSCAN_TEMPLATES_URL    raw base URL of this repo at a ref, e.g.
#                            https://raw.githubusercontent.com/<owner>/appscan360-gitlab/v1
#                            https://gitlab.example.com/<group>/appscan360-gitlab/-/raw/v1
#   APPSCAN_SCRIPTS_GIT_URL  clone URL, e.g. https://github.com/<owner>/appscan360-gitlab.git
#                            or https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.example.com/<group>/appscan360-gitlab.git
#   APPSCAN_SCRIPTS_GIT_REF  v1
# (GitLab expands group/instance/project CI/CD variables inside include:, but not variables from a
#  .gitlab-ci.yml `variables:` block.) Moving the repo = changing those variables.
#
# Overriding a value for one group/project: set a CI/CD variable of the same name in the GitLab UI
# (Settings > CI/CD > Variables). UI variables take precedence over the defaults below.
#
# Secrets (never in this file): APPSCAN_SERVICE_URL, APPSCAN_KEY, APPSCAN_SECRET, APPSCAN_ASSET,
#   GITHUB_TOKEN (private central repo), DAST_LOGIN_PASSWORD / DAST_API_KEYS / DAST_OTP_SECRET when needed.
#
# Where the integration scripts come from (APPSCAN_SCRIPTS_SOURCE):
#   git     (default) cloned at job start from $APPSCAN_SCRIPTS_GIT_URL (ref $APPSCAN_SCRIPTS_GIT_REF)
#   repo    committed in the scanned project under $APPSCAN_SCRIPTS_DIR
#   runner  pre-installed on the runner host / in the job image at $APPSCAN_SCRIPTS_DIR (see Dockerfile)

variables:
  # ---- runner: the job must run on a runner that can reach the AppScan 360° host.
  #      Either disable instance/shared runners for the project, or tag your runner and set this:
  APPSCAN_RUNNER_TAG: ""                              # e.g. "appscan"

  # ---- where the integration scripts come from
  APPSCAN_SCRIPTS_SOURCE: "git"                       # git | repo | runner
  APPSCAN_SCRIPTS_GIT_URL: $APPSCAN_SCRIPTS_GIT_URL  # set at group level (see header); private GitHub: https://${GITHUB_TOKEN}@github.com/...
  APPSCAN_SCRIPTS_GIT_REF: $APPSCAN_SCRIPTS_GIT_REF  # set at group level, e.g. v1
  # APPSCAN_SCRIPTS_DIR: "appscan360"                 # only for repo/runner

  # ---- AppScan 360° connection (URL/key/secret come from CI/CD variables)
  APPSCAN_AUTH_MODE: "token"                          # token (ApiKeyLogin) | direct (X-Api-Key)
  APPSCAN_ACCEPT_UNTRUSTED_SSL: "yes"                 # "no" once the certificate is trusted
  # APPSCAN_CA_BUNDLE: "$APPSCAN_CA_PEM"              # file-type CI variable with the CA PEM
  APPSCAN_HTTP_TIMEOUT: "60"

  # ---- application
  APPSCAN_APP_ID: ""                                  # existing application id: used as-is, never created (wins over APP_NAME)
  APPSCAN_APP_NAME: $CI_PROJECT_NAME                  # else: look up by name, create if missing ...
  APPSCAN_ASSET: ""                                   # ... in this asset group (Id or Name); empty = default/only group
  # APPSCAN_BUSINESS_IMPACT: "High"                   # Low | Medium | High | Critical (on create)

  # ---- scan naming / behaviour
  APPSCAN_SCAN_NAME: $CI_PROJECT_NAME-$CI_JOB_ID
  APPSCAN_SCAN_COMMENT: "Triggered by GitLab pipeline $CI_PIPELINE_ID"
  APPSCAN_PERSONAL_SCAN: "no"                         # personal scan = does not affect app issues/compliance
  APPSCAN_WAIT: "yes"                                 # wait for completion (needed for reports/gates)
  APPSCAN_POLL_SECONDS: "30"
  APPSCAN_TIMEOUT_MINUTES: "360"
  # APPSCAN_RESCAN_ID: ""                             # re-execute an existing scan instead of creating one
  APPSCAN_DEBUG: "no"

  # ---- reports (job artifacts) : html,pdf,xml,csv,sarif,json,gitlab  (+ license,sbom for SCA)
  APPSCAN_REPORT_FORMATS: "html,xml,gitlab"
  APPSCAN_REPORT_APPLY_POLICIES: "None"               # None | All | Select
  APPSCAN_SBOM_FORMAT: "SPDX_Json"                    # SPDX_Json | SPDX_Text | CycloneDX_Json | CycloneDX_XML

  # ---- security gates : severity,threshold,branch,compliance,license
  APPSCAN_GATES: "severity"
  APPSCAN_SEV_SEC_GW: "criticalIssues"                # criticalIssues|highIssues|mediumIssues|lowIssues|totalIssues
  APPSCAN_MAX_ISSUES_ALLOWED: "0"                     # fail if more than this many
  APPSCAN_FAILURE_THRESHOLD: "High"                   # threshold gate: fail on any issue >= this severity
  APPSCAN_GATE_ALLOW_FAILURE: "no"                    # yes = report only, never fail the job

  GIT_DEPTH: "2"                                      # needed for SAST_LATEST_COMMIT_ONLY

.appscan360_base:
  # Windows runner: shell executor with PowerShell; Python 3 + git on PATH. No image.
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  tags:
    - $APPSCAN_RUNNER_TAG                     # "" = any runner; set to your runner's tag to force it (see below)
  before_script:
    - |
      $ErrorActionPreference = "Stop"
      switch ($env:APPSCAN_SCRIPTS_SOURCE) {
        "git" {
          Write-Host "Fetching AppScan 360° scripts from $env:APPSCAN_SCRIPTS_GIT_URL@$env:APPSCAN_SCRIPTS_GIT_REF"
          Remove-Item -Recurse -Force .appscan360-scripts -ErrorAction SilentlyContinue
          git clone --depth 1 --branch $env:APPSCAN_SCRIPTS_GIT_REF $env:APPSCAN_SCRIPTS_GIT_URL .appscan360-scripts
          if ($LASTEXITCODE -ne 0) { throw "git clone failed" }
          $env:APPSCAN_SCRIPTS_DIR = "$env:CI_PROJECT_DIR\.appscan360-scripts"
        }
        "runner" { Write-Host "Using scripts pre-installed on the runner at $env:APPSCAN_SCRIPTS_DIR" }
        default  { if (-not [System.IO.Path]::IsPathRooted($env:APPSCAN_SCRIPTS_DIR)) { $env:APPSCAN_SCRIPTS_DIR = "$env:CI_PROJECT_DIR\$env:APPSCAN_SCRIPTS_DIR" } }
      }
      if (-not (Test-Path "$env:APPSCAN_SCRIPTS_DIR\appscan360.py")) { throw "appscan360.py not found in $env:APPSCAN_SCRIPTS_DIR" }
      $py = (Get-Command python -ErrorAction SilentlyContinue).Source
      if (-not $py) { $py = (Get-Command py -ErrorAction Stop).Source }
      & $py -c "import requests" 2>$null
      if ($LASTEXITCODE -ne 0) { & $py -m pip install -q -r "$env:APPSCAN_SCRIPTS_DIR\requirements.txt" }
      $env:AS360 = "& `"$py`" `"$env:APPSCAN_SCRIPTS_DIR\appscan360.py`""
      Write-Host "AppScan 360° host: $env:APPSCAN_SERVICE_URL  app: $env:APPSCAN_APP_NAME  scan: $env:APPSCAN_SCAN_NAME  gates: $env:APPSCAN_GATES"
  artifacts:
    when: always
    paths:
      - "*_report.html"
      - "*_report.pdf"
      - "*_report.xml"
      - "*_issues.*"
      - "SCA_sbom.*"
      - ".appscan360/dast_payload.json"
      - ".appscan360/*.irx"
      - ".appscan360/presence.log"
