# ============================================================================================
# OPTION B - central repo is a PRIVATE project on a DIFFERENT (remote) GitLab instance.
# Central project: Settings > Access tokens -> role Reporter, scopes read_api + read_repository.
# Group-level CI/CD variables (mask the token):
#   APPSCAN_TEMPLATES_URL   = https://gitlab.remote.com/security/appscan360-gitlab/-/raw/v1
#   APPSCAN_TEMPLATES_TOKEN = glpat-xxxxxxxx
#   APPSCAN_SCRIPTS_GIT_URL = https://oauth2:glpat-xxxxxxxx@gitlab.remote.com/security/appscan360-gitlab.git
#   APPSCAN_SCRIPTS_GIT_REF = v1
# Project .gitlab-ci.yml:
#   include:
#     - remote: '$APPSCAN_TEMPLATES_URL/yaml-gitlab-remote-private/appscan360_scan_sast.yaml?private_token=$APPSCAN_TEMPLATES_TOKEN'
# ============================================================================================
# DAST API scan - Postman collection, OpenAPI definition, or recorded API traffic. Include this one line in a project's .gitlab-ci.yml (nothing else needed):
#   include:
#     - remote: '$APPSCAN_TEMPLATES_URL/yaml-gitlab-remote-private/appscan360_scan_dast_api.yaml?private_token=$APPSCAN_TEMPLATES_TOKEN'
# Override any value below with a CI/CD variable of the same name (group or project level).
include:
  - remote: '$APPSCAN_TEMPLATES_URL/yaml-gitlab-remote-private/appscan360_base.yaml?private_token=$APPSCAN_TEMPLATES_TOKEN'   # <<< B token added

stages:
  - scan-dast

appscan360-dast-api:
  extends: .appscan360_base
  stage: scan-dast
  needs: []
  variables:
    DAST_MODE: "api"
    DAST_API_METHOD: "openapi"          # postman | openapi | traffic
    DAST_API_BASE_URL: "https://api.example.com"
    DAST_API_DOMAINS: "api.example.com"
    DAST_OPENAPI_FILE: "openapi.yaml"   # or DAST_OPENAPI_URL
    DAST_OPENAPI_URL: ""
    DAST_API_KEYS: "$DAST_API_KEYS"     # "X-Api-Key=abc,Other=xyz" masked variable
    DAST_POSTMAN_COLLECTION: ""         # collection.json
    DAST_POSTMAN_ENV: ""
    DAST_POSTMAN_GLOBALS: ""
    DAST_POSTMAN_LINKED_FILES: ""       # zip
    DAST_EXPLORE_FILES: ""              # recorded API traffic (.dast.config) for method=traffic
    DAST_LOGIN_METHOD: "none"
    DAST_LOGIN_FILE: ""
    DAST_PRESENCE_ID: ""
    DAST_TEST_POLICY_ID: ""
    DAST_OPTIMIZATION: "Fast"
    APPSCAN_GATES: "severity"
    DAST_LOGIN_FILE: ""
    DAST_EXCLUDE_PATHS: ""
    DAST_ADDITIONAL_DOMAINS: ""
    DAST_THREADS: "10"
    DAST_SCAN_PRIORITY: "Regular"
    DAST_EPHEMERAL_PRESENCE: "no"
    DAST_PAYLOAD_JSON: ""
    # ---- files may also live on the runner (absolute path, outside builds/), e.g. on Windows:
    # DAST_POSTMAN_COLLECTION: "C:\\appscan360\\collections\\api.postman_collection.json"
    # DAST_POSTMAN_ENV: "C:\\appscan360\\collections\\api.postman_environment.json"
    # DAST_OPENAPI_FILE: "C:\\appscan360\\collections\\openapi.yaml"
    # ---- authentication
    #  openapi : DAST_API_KEYS="<securityScheme key name>=<value>,..." -> OpenAPI.LoginKeys; the name must match the
    #            apiKey security scheme declared in the OpenAPI definition (header/query/cookie placement comes from it)
    #  postman : DAST_API_KEYS is ignored. Put auth in the collection (Authorization tab or headers, e.g. {{api_key}})
    #            and supply the value through a Postman environment file: DAST_POSTMAN_ENV
    # DAST_API_KEYS: "$DAST_API_KEYS"       # masked CI/CD variable, e.g. "X-Api-Key=abc"
    # ---- commonly overridden settings (defaults live in appscan360_base.yaml) -------------------
    # APPSCAN_APP_ID: ""                   # existing application id (never created); else APPSCAN_APP_NAME + APPSCAN_ASSET
    # APPSCAN_APP_NAME: $CI_PROJECT_NAME   # application name for lookup / auto-create
    # APPSCAN_ASSET: ""                    # asset group id or name for auto-create; empty = default group
    # APPSCAN_RUNNER_TAG: ""               # tag of the runner that can reach AppScan 360°
    # APPSCAN_SCAN_NAME: $CI_PROJECT_NAME-$CI_JOB_ID
    # APPSCAN_RESCAN_ID: ""                # re-execute an existing scan instead of creating a new one
    # APPSCAN_PERSONAL_SCAN: "no"
    # APPSCAN_TIMEOUT_MINUTES: "360"
    # APPSCAN_REPORT_FORMATS: "html,xml,gitlab"   # html,pdf,xml,csv,sarif,json,gitlab (+license,sbom for SCA)
    # APPSCAN_REPORT_DIR: "as360_output"   # artifact folder inside the project (excluded from scans)
    # ---- gates: fail the job on findings ----------------------------------------------------
    # APPSCAN_GATES: "threshold"           # severity | threshold | branch | compliance | license (comma list)
    # APPSCAN_FAILURE_THRESHOLD: "High"    # threshold gate: fail on any High or Critical
    # APPSCAN_SEV_SEC_GW: "criticalIssues" # severity gate: criticalIssues|highIssues|mediumIssues|lowIssues|totalIssues ...
    # APPSCAN_MAX_ISSUES_ALLOWED: "0"      # ... allowed count of that severity
    # APPSCAN_GATE_ALLOW_FAILURE: "no"     # yes = report only, never fail the job
  artifacts:
    reports:
      dast: as360_output/gl-dast-report.json
  script:
    - $AS360 app
    - $AS360 dast
    - $AS360 report
    - $AS360 gate $APPSCAN_GATES
