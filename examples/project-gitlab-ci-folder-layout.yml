# Folder layout on the runner (default in the base templates, no runner configuration needed):
#   <builds>/<runner-id>/0/<group>/<project>   project checkout (GitLab default)
#   <builds>/as360_worker_scripts              integration scripts (APPSCAN_SCRIPTS_CLONE_DIR), never scanned
# Optional: also relocate the checkout. This one DOES need runner permission:
#   config.toml  →  [[runners]]  [runners.custom_build_dir]  enabled = true
include:
  - remote: '$APPSCAN_TEMPLATES_URL/yaml/appscan360_scan_sast_windows.yaml'   # or the Linux / private-repo variant

# variables:
#   GIT_CLONE_PATH: $CI_BUILDS_DIR/repo_source_code/$CI_PROJECT_NAME   # optional, see above
#   APPSCAN_SCRIPTS_CLONE_DIR: ""                                     # per-job temp folder instead
