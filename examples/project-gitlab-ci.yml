# The ONLY thing a project needs (or nothing at all when using a compliance framework).
# Requires the group-level CI/CD variables APPSCAN_TEMPLATES_URL, APPSCAN_SCRIPTS_GIT_URL,
# APPSCAN_SCRIPTS_GIT_REF (plus APPSCAN_SERVICE_URL / KEY / SECRET). Keep just the scans you want.
include:
  - remote: '$APPSCAN_TEMPLATES_URL/yaml/appscan360_scan_sast.yaml'
  - remote: '$APPSCAN_TEMPLATES_URL/yaml/appscan360_scan_sca.yaml'
  - remote: '$APPSCAN_TEMPLATES_URL/yaml/appscan360_scan_dast.yaml'
  # - remote: '$APPSCAN_TEMPLATES_URL/yaml/appscan360_scan_dast_api.yaml'
